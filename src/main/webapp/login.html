<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #1e293b;
        }

        .container {
            display: flex;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 1000px;
            width: 90%;
            min-height: 600px;
            position: relative;
        }

        .form-section {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.6s ease;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .image-section {
            flex: 1;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            transition: all 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        .image-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23334155" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.4;
        }

        .image-content {
            z-index: 1;
            padding: 40px;
            position: relative;
        }

        .image-content h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .image-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.8;
            color: #cbd5e1;
        }

        .form-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0f172a;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .form-subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .form-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: color 0.3s ease;
            z-index: 1;
        }

        .form-control {
            width: 100%;
            padding: 16px 20px 16px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fefefe;
            outline: none;
            font-weight: 500;
        }

        .form-control:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        .form-control:focus + i {
            color: #3b82f6;
        }

        .btn-primary {
            width: 100%;
            background: #3b82f6;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .social-login {
            margin-top: 32px;
        }

        .social-title {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
            position: relative;
            font-weight: 500;
        }

        .social-title::before,
        .social-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: #e2e8f0;
        }

        .social-title::before {
            left: 0;
        }

        .social-title::after {
            right: 0;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .social-btn:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .social-btn.google {
            color: #ea4335;
        }

        .social-btn.facebook {
            color: #1877f2;
        }

        .social-btn.twitter {
            color: #1da1f2;
        }

        .form-switch {
            text-align: center;
            margin-top: 32px;
            color: #64748b;
            font-weight: 500;
        }

        .form-switch a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .form-switch a:hover {
            color: #2563eb;
        }

        .forgot-password {
            text-align: right;
            margin-top: 12px;
        }

        .forgot-password a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #2563eb;
        }

        /* Animations */
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-section {
            animation: slideInLeft 0.8s ease;
        }

        .image-section {
            animation: slideInRight 0.8s ease;
        }

        /* Hidden forms */
        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.5;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 12px;
            margin-top: 2px;
            transform: scale(1.2);
            accent-color: #3b82f6;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success/Error states */
        .form-control.success {
            border-color: #10b981;
            background-color: #f0fdfa;
        }

        .form-control.error {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                max-width: 400px;
                margin: 20px;
                border-radius: 20px;
            }

            .image-section {
                min-height: 200px;
                order: -1;
            }

            .form-section {
                padding: 40px 30px;
            }

            .form-title {
                font-size: 2rem;
            }

            .image-content h2 {
                font-size: 2rem;
            }

            .social-buttons {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
                width: 95%;
            }

            .form-section {
                padding: 30px 20px;
            }

            .form-title {
                font-size: 1.8rem;
            }
        }

        /* Enhanced visual effects */
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-shapes::before,
        .floating-shapes::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .floating-shapes::before {
            width: 120px;
            height: 120px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-shapes::after {
            width: 80px;
            height: 80px;
            bottom: 20%;
            right: 20%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Focus states enhancement */
        .form-control:focus {
            animation: focusPulse 0.3s ease;
        }

        @keyframes focusPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="form-section">

        <!-- LOGIN FORM (NOW CONNECTED TO SERVLET) -->
        <div class="form-container active" id="loginForm">

            <h1 class="form-title">Welcome Back</h1>
            <p class="form-subtitle">Sign in to your account to continue your journey</p>
            <p id="errorMsg" style="
    color: #ef4444;
    font-weight: 600;
    text-align: center;
    margin-bottom: 15px;
    display: none;
"></p>
            <p id="successMsg" style="
    color: #10b981;
    font-weight: 600;
    text-align: center;
    margin-bottom: 15px;
    display: none;
"></p>
            <!-- 🔥 BACKEND CONNECTION ADDED HERE -->
            <form action="login" method="post" id="loginFormSubmit">

                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    <i class="fas fa-envelope"></i>
                </div>

                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <i class="fas fa-lock"></i>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-spinner loading"></i>
                    <span class="btn-text">Sign In</span>
                </button>

            </form>

            <div class="form-switch">
                Don't have an account? <a href="#" onclick="showSignup()">Create one</a>
            </div>

        </div>

        <!-- SIGNUP FORM (still frontend only for now) -->
        <div class="form-container" id="signupForm">

            <h1 class="form-title">Create Account</h1>

            <form action="signup" method="post" id="signupFormSubmit">

                <div class="form-group">
                    <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                    <i class="fas fa-user"></i>
                </div>

                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    <i class="fas fa-envelope"></i>
                </div>

                <div class="form-group">
                    <input type="text" name="country" class="form-control" placeholder="Country" required>
                    <i class="fas fa-globe"></i>
                </div>

                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <i class="fas fa-lock"></i>
                </div>

                <button type="submit" class="btn-primary">
                    Create Account
                </button>

            </form>

            <div class="form-switch">
                Already have an account? <a href="#" onclick="showLogin()">Sign in</a>
            </div>

        </div>

        <!-- FORGOT PASSWORD -->
        <div class="form-container" id="forgotForm">

            <h1 class="form-title">Reset Password</h1>

            <form id="forgotFormSubmit">

                <div class="form-group">
                    <input type="email" class="form-control" placeholder="Email Address" required>
                    <i class="fas fa-envelope"></i>
                </div>

                <button type="submit" class="btn-primary">
                    Send Reset Instructions
                </button>

            </form>

            <div class="form-switch">
                Remember your password? <a href="#" onclick="showLogin()">Sign in</a>
            </div>

        </div>

    </div>

    <!-- IMAGE SIDE -->
    <div class="image-section">
        <div class="image-content">
            <h2>Hello, Friend!</h2>
            <p>Enter your personal details and start your journey with us today</p>
        </div>
    </div>

</div>

<script>
    function showSignup() {
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('signupForm').classList.add('active');
        document.getElementById('forgotForm').classList.remove('active');
    }

    function showLogin() {
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('signupForm').classList.remove('active');
        document.getElementById('forgotForm').classList.remove('active');
    }

    function showForgotPassword() {
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('forgotForm').classList.add('active');
    }
    window.onload = function () {
        const params = new URLSearchParams(window.location.search);

        // ================= ERROR HANDLING =================
        const error = params.get("error");
        if (error === "1") {
            const msg = document.getElementById("errorMsg");
            msg.innerText = "Invalid email or password!";
            msg.style.display = "block";
        }
        // ✅ ADD THIS
        if (error === "banned") {
            const msg = document.getElementById("errorMsg");
            msg.innerText = "Your account has been banned. Please contact support.";
            msg.style.display = "block";
        }
        // ================= SIGNUP SUCCESS =================
        const signup = params.get("signup");
        if (signup === "success") {
            const successMsg = document.getElementById("successMsg");
            successMsg.innerText = "Account created successfully! Please login.";
            successMsg.style.display = "block";
        }
    };
</script>

</body>
</html>
